<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Standalone revision tool for BTEC Level 3 IT Unit 14 IT Service Delivery. No sign in, no AI, works offline.">
<title>Unit 14 Revision Bot</title>
<style>
/* Unit 14 Revision Bot styles. Sans serif, readable sizes, three themes, print friendly. */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface2: #eef2fa; --text: #14213d; --muted: #4a5568; --border: #d3dae8;
  --primary: #0f2d5c; --on-primary: #ffffff; --accent: #1f4e9c; --link: #1b4fa8;
  --good: #1c7c4d; --good-bg: #e3f4ea; --bad: #a82820; --bad-bg: #fbe8e6; --warn-bg: #fff6d6;
  --hl-fact: #cfeedd; --hl-term: #e2d7fb; --hl-conn: #cfe3fb; --focus: #ffb000; --shadow: 0 1px 3px rgba(15,45,92,.12);
}
:root[data-theme="cream"] {
  --bg: #f8f2e2; --surface: #fffcf3; --surface2: #f3ead2; --text: #2b2519; --muted: #5a5039; --border: #dccfae;
  --primary: #0f2d5c; --on-primary: #ffffff; --accent: #214b8f; --link: #1b4a99;
  --good-bg: #e0efd8; --bad-bg: #f8e2d9; --warn-bg: #fbf0c4; --hl-fact: #cbe8cf; --hl-term: #e3d6f3; --hl-conn: #cde0f1;
}
:root[data-theme="dark"] {
  --bg: #0d1524; --surface: #162136; --surface2: #1d2b45; --text: #e8edf6; --muted: #b0bbd0; --border: #2f3f5e;
  --primary: #3a6fd6; --on-primary: #ffffff; --accent: #7aa7f5; --link: #9cc0ff;
  --good: #66d19a; --good-bg: #17392a; --bad: #ff9a92; --bad-bg: #432020; --warn-bg: #3c3516;
  --hl-fact: #1f5a3b; --hl-term: #4a3a7a; --hl-conn: #264f86; --focus: #ffcc4d; --shadow: 0 1px 3px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 1rem; line-height: 1.55; color: var(--text); background: var(--bg); }
a { color: var(--link); }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; color: var(--text); }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
p { margin: 0 0 .8rem; }
ul { margin: 0 0 .8rem; padding-left: 1.3rem; }
li { margin-bottom: .3rem; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.small { font-size: .9rem; color: var(--muted); }
.sub { font-size: .9rem; color: var(--muted); }
.skip { position: absolute; left: -999px; top: 0; background: var(--primary); color: var(--on-primary); padding: .6rem 1rem; z-index: 50; }
.skip:focus { left: 0; }

/* Header and navigation */
header.site { background: var(--primary); color: #fff; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; padding: .75rem 1rem; }
.brand { display: flex; align-items: center; gap: .75rem; min-width: 0; }
.logo { background: #fff; color: var(--primary); font-weight: 800; border-radius: 8px; padding: .35rem .55rem; letter-spacing: .02em; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-size: 1.15rem; }
.brand-text span { font-size: .9rem; opacity: .9; }
.controls { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.iconbtn { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: 8px; padding: .35rem .65rem; font: inherit; font-size: .95rem; cursor: pointer; min-height: 40px; }
.iconbtn:hover { background: rgba(255,255,255,.26); }
.small-select { padding: .3rem .5rem; min-height: 40px; }
nav#nav { display: flex; gap: .25rem; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--border); padding: .35rem .75rem; position: sticky; top: 0; z-index: 10; scrollbar-width: thin; }
nav#nav a { white-space: nowrap; text-decoration: none; color: var(--text); padding: .55rem .8rem; border-radius: 8px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }
nav#nav a:hover { background: var(--surface2); }
nav#nav a[aria-current="page"] { background: var(--primary); color: var(--on-primary); }
.teacherbar { background: var(--warn-bg); color: var(--text); padding: .5rem 1rem; text-align: center; font-weight: 600; border-bottom: 1px solid var(--border); }

main { max-width: 62rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
main:focus, h1[tabindex="-1"]:focus { outline: none; }
.site-footer { text-align: center; padding: 1.25rem 1rem 2rem; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--border); }

/* Buttons and forms */
.btn { display: inline-block; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; padding: .6rem 1.1rem; border-radius: 10px; border: 2px solid var(--primary); background: var(--surface); color: var(--primary); min-height: 44px; text-align: center; }
:root[data-theme="dark"] .btn { border-color: var(--accent); color: var(--accent); }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
:root[data-theme="dark"] .btn.primary { color: #fff; border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.15); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.linkish { background: none; border: none; color: var(--link); text-decoration: underline; cursor: pointer; font: inherit; padding: .25rem; }
.select, .ask-input, textarea.answer { font: inherit; padding: .6rem .75rem; border: 2px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); width: 100%; min-height: 44px; }
.select { width: auto; max-width: 100%; }
.ask-input:focus, textarea.answer:focus, .select:focus { border-color: var(--accent); }
textarea.answer { line-height: 1.5; resize: vertical; }
.ask-form { display: flex; gap: .5rem; margin-bottom: .75rem; }
.ask-form .btn { flex: 0 0 auto; }
.form { display: grid; gap: 1rem; max-width: 36rem; }
.field { display: flex; flex-direction: column; gap: .3rem; }
.field label { font-weight: 600; }
.field.check { flex-direction: row; align-items: center; gap: .5rem; }
input[type="checkbox"] { width: 1.25rem; height: 1.25rem; accent-color: var(--primary); flex: 0 0 auto; }
.row-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0; }
.row-between { display: flex; justify-content: space-between; margin: .3rem 0; }
.check-row { display: flex; gap: .6rem; align-items: flex-start; margin: .4rem 0; }
.check-row label { cursor: pointer; }

/* Layout pieces */
.page-head { margin-bottom: 1rem; }
.intro { font-size: 1.08rem; color: var(--muted); max-width: 46rem; }
.back { display: inline-block; margin-bottom: .75rem; font-weight: 600; }
.hero { background: linear-gradient(135deg, var(--primary), #1e4a8a); color: #fff; border-radius: 16px; padding: 1.5rem 1.25rem; margin-bottom: 1.25rem; }
.hero h1, .hero .intro { color: #fff; }
.hero .intro { opacity: .95; }
.hero-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
.hero .btn { background: #fff; color: var(--primary); border-color: #fff; }
.hero .btn.primary { background: #ffcc4d; color: #1b1b1b; border-color: #ffcc4d; }
.tiles, .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .85rem; margin-bottom: 1.25rem; }
.tile, .topic-card { display: flex; flex-direction: column; gap: .3rem; background: var(--surface); border: 1px solid var(--border); border-left: 6px solid var(--accent); border-radius: 12px; padding: .9rem 1rem; text-decoration: none; color: var(--text); box-shadow: var(--shadow); font: inherit; text-align: left; cursor: pointer; min-height: 44px; }
.tile:hover, .topic-card:hover { background: var(--surface2); }
.tile strong, .topic-card strong { font-size: 1.1rem; color: var(--text); }
.tile span { color: var(--muted); font-size: .95rem; }
.tile.wide { margin-bottom: 1rem; border-left-color: #c78a00; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.15rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
.card.suggest { border-left: 6px solid var(--good); }
.card.note { border-left: 6px solid #c78a00; }
.card.bad { border-left: 6px solid var(--bad); background: var(--bad-bg); }
.card.lock { max-width: 36rem; margin: 3rem auto; text-align: center; }
h2.group { margin-top: 1.5rem; }
.tag { display: inline-block; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: .1rem .65rem; font-size: .85rem; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem; margin-bottom: 1rem; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: .8rem; text-align: center; box-shadow: var(--shadow); }
.stat strong { display: block; font-size: 1.5rem; color: var(--accent); }
.stat span { font-size: .9rem; color: var(--muted); }
.bigscore { font-size: 1.25rem; font-weight: 700; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: .45rem; margin: .5rem 0; }
.chip { font: inherit; font-size: .95rem; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: .35rem .85rem; cursor: pointer; min-height: 40px; }
.chip:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.chips-top { margin-bottom: .5rem; }
.also, .related { margin-top: .75rem; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }

/* Knowledge cards */
.kb-card { background: var(--surface); border: 1px solid var(--border); border-left: 6px solid var(--accent); border-radius: 12px; padding: 1rem 1.15rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
.kb-card header { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .4rem; }
.kb-card header h2, .kb-card header h3 { margin: 0; flex: 1 1 14rem; }
.kb-card .spec { font-size: .85rem; color: var(--muted); }
.kb-card .lead { font-size: 1.08rem; font-weight: 500; }
.kb-card .eg { background: var(--surface2); border-radius: 8px; padding: .55rem .75rem; }
.kb-card.compact { margin-bottom: 0; }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
details.acc { background: var(--surface); border: 1px solid var(--border); border-left: 6px solid var(--accent); border-radius: 12px; margin-bottom: .7rem; box-shadow: var(--shadow); }
details.acc > summary { cursor: pointer; padding: .8rem 2.6rem .8rem 1rem; display: block; list-style: none; min-height: 44px; position: relative; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary::after { content: "+"; position: absolute; right: 1rem; top: .65rem; font-weight: 800; font-size: 1.3rem; color: var(--accent); }
details.acc[open] > summary::after { content: "\2212"; }
details.acc > summary .sub { display: block; }
details.acc .kb-card { margin: 0 1rem 1rem; box-shadow: none; }
.acc-body { padding: 0 1rem 1rem; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; }
.good { background: var(--good-bg); border-radius: 10px; padding: .6rem 1rem; }
.weak { background: var(--bad-bg); border-radius: 10px; padding: .6rem 1rem; }
.find-list { list-style: none; padding: 0; }
.find-list li { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .55rem .8rem; }

/* Chat */
.chat { margin-top: .75rem; }
.exchange { margin-bottom: 1.5rem; }
.you { background: var(--primary); color: #fff; border-radius: 14px 14px 4px 14px; padding: .6rem 1rem; max-width: 85%; margin-left: auto; }
:root[data-theme="dark"] .you { background: #274a8e; }
.who { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; opacity: .8; margin-right: .5rem; }
.bot { margin-top: .6rem; }
.bot > .who { display: block; color: var(--muted); margin-bottom: .25rem; }
.bot-card { background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; padding: 1rem; }
.ask-tools { text-align: right; }

/* Visuals */
.vz { margin: .75rem 0; padding: .75rem; background: var(--surface2); border-radius: 12px; }
.vz figcaption { font-size: .85rem; color: var(--muted); margin-top: .5rem; }
.vz-row { display: flex; flex-wrap: wrap; align-items: stretch; gap: .5rem; justify-content: center; }
.vz-step, .vz-tile { background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: .65rem .8rem; display: flex; flex-direction: column; gap: .2rem; flex: 1 1 11rem; max-width: 16rem; font-size: .95rem; }
.vz-step strong, .vz-tile strong { color: var(--accent); }
.vz-num { background: var(--accent); color: #fff; width: 1.6rem; height: 1.6rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
.vz-arrow { align-self: center; font-size: 1.6rem; color: var(--accent); }
.vz-loop { text-align: center; margin-top: .6rem; font-weight: 600; color: var(--accent); }
.vz-grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .6rem; }
.vz-tile { max-width: none; }
.vz-scroll { overflow-x: auto; }
table.vz-table, table.grid { border-collapse: collapse; width: 100%; background: var(--surface); }
table.vz-table caption { text-align: left; font-weight: 700; padding-bottom: .4rem; }
table.vz-table th, table.vz-table td, table.grid th, table.grid td { border: 1px solid var(--border); padding: .45rem .6rem; text-align: left; vertical-align: top; font-size: .95rem; }
table.vz-table thead th, table.grid thead th { background: var(--primary); color: #fff; }
td.who-you { background: #fde6b8; color: #3a2a00; font-weight: 600; }
td.who-provider { background: #cfe3fb; color: #0f2d5c; font-weight: 600; }
td.who-shared { background: #d8eed5; color: #17421f; font-weight: 600; }
:root[data-theme="dark"] td.who-you { background: #6b4d0a; color: #fff; }
:root[data-theme="dark"] td.who-provider { background: #22457f; color: #fff; }
:root[data-theme="dark"] td.who-shared { background: #1f5a3b; color: #fff; }

/* Bars and progress */
.barrow { margin: .6rem 0; }
.barlabel { display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; font-weight: 600; }
.bar, .progressbar { background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; height: .85rem; overflow: hidden; }
.bar span, .progressbar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
.progressbar { margin-bottom: .4rem; }

/* Flashcards */
.cardrun, .quizrun { max-width: 44rem; margin: 0 auto; }
.flash { background: var(--surface); border: 2px solid var(--accent); border-radius: 18px; padding: 1.5rem 1.25rem; min-height: 14rem; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: center; }
.flash.front { align-items: center; text-align: center; }
.flash.front h2 { font-size: 1.8rem; margin: .6rem 0; }
.flash.back h2 { color: var(--accent); }
.flash .lead { font-size: 1.1rem; }

/* Quiz */
.qtext { font-size: 1.35rem; margin: .5rem 0 1rem; }
.options { display: grid; gap: .6rem; margin-bottom: 1rem; }
.option { display: flex; gap: .75rem; align-items: center; text-align: left; font: inherit; background: var(--surface); color: var(--text); border: 2px solid var(--border); border-radius: 12px; padding: .75rem .9rem; cursor: pointer; min-height: 52px; }
.option:hover:not(:disabled) { border-color: var(--accent); background: var(--surface2); }
.option .key { flex: 0 0 auto; width: 1.9rem; height: 1.9rem; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
.option .otext { display: flex; flex-direction: column; }
.option:disabled { cursor: default; opacity: 1; color: var(--text); }
.option.right { border-color: var(--good); background: var(--good-bg); }
.option.wrong { border-color: var(--bad); background: var(--bad-bg); }
.feedback { border-radius: 12px; padding: .8rem 1rem; margin-bottom: 1rem; }
.feedback:empty { display: none; }
.feedback.ok { background: var(--good-bg); border: 1px solid var(--good); }
.feedback.bad { background: var(--bad-bg); border: 1px solid var(--bad); }
.review { border-bottom: 1px solid var(--border); padding-bottom: .5rem; margin-bottom: .75rem; }
.statement { font-size: 1.25rem; background: var(--surface); border-left: 6px solid var(--accent); margin: .75rem 0 1rem; padding: .9rem 1.1rem; border-radius: 10px; }

/* Practice */
.prompt { background: var(--warn-bg); border-left: 6px solid #c78a00; border-radius: 10px; padding: .8rem 1rem; margin: .75rem 0; font-size: 1.05rem; }
.tip { font-size: .95rem; color: var(--muted); }
details.scenario { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: .7rem 1rem; margin: .75rem 0; }
details.scenario summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; }
mark { padding: 0 .15rem; border-radius: 3px; color: inherit; }
mark.hl-fact { background: var(--hl-fact); }
mark.hl-term { background: var(--hl-term); }
mark.hl-conn { background: var(--hl-conn); }
.marked { white-space: pre-wrap; line-height: 1.7; }
ul.points { list-style: none; padding: 0; }
ul.points li { display: flex; gap: .6rem; padding: .35rem .6rem; border-radius: 8px; }
ul.points li.yes { background: var(--good-bg); }
ul.points li.no { background: var(--bad-bg); }
.mark-ic { font-weight: 800; flex: 0 0 1.2rem; }
.tipbox { background: var(--warn-bg); border-radius: 10px; padding: .6rem 1rem; margin: .75rem 0; }
.legend mark { margin-right: .3rem; }
.mistake { border-bottom: 1px solid var(--border); padding: .4rem 0; }
.mistake .bad { color: var(--bad); margin: 0; }
.mistake .fix { color: var(--good); margin: 0 0 .3rem; }
dl.themes dt { font-weight: 700; margin-top: .6rem; color: var(--accent); }
dl.themes dd { margin: 0 0 .4rem; }
.subtabs { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
.subtabs a { text-decoration: none; padding: .5rem .85rem; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text); font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }
.subtabs a[aria-current="page"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

@media (max-width: 40rem) {
  h1 { font-size: 1.5rem; }
  .ask-form { flex-direction: column; }
  .you { max-width: 95%; }
  main { padding: 1rem .85rem 2.5rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* Print: clean A4 output */
@media print {
  @page { size: A4; margin: 15mm; }
  body { background: #fff; color: #000; font-size: 11pt; }
  header.site, nav#nav, .controls, .row-actions, .chips-top, .ask-form, .ask-tools, .skip, .site-footer .btn, .teacherbar, .btn { display: none !important; }
  main { max-width: none; padding: 0; }
  .card, .kb-card, details.acc { box-shadow: none; break-inside: avoid; border-color: #999; }
  details.acc:not([open]) > *:not(summary) { display: block; }
  a { color: #000; text-decoration: none; }
  .site-footer { border: 0; }
}

</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site">
  <div class="brand">
    <span class="logo" aria-hidden="true">U14</span>
    <div class="brand-text"><strong id="site-title">Unit 14 Revision Bot</strong><span id="site-sub">Exeter College</span></div>
  </div>
  <div class="controls" id="controls"></div>
</header>
<nav id="nav" aria-label="Main">
  <a href="#/home" data-route="home">Home</a>
  <a href="#/ask" data-route="ask">Ask</a>
  <a href="#/learn" data-route="learn">Learn</a>
  <a href="#/cards" data-route="cards">Flashcards</a>
  <a href="#/quiz" data-route="quiz">Quiz</a>
  <a href="#/practice" data-route="practice">Practice</a>
  <a href="#/papers" data-route="papers">Past papers</a>
  <a href="#/coach" data-route="coach">Exam coach</a>
  <a href="#/progress" data-route="progress">Progress</a>
</nav>
<main id="main" tabindex="-1">
  <noscript><div class="card"><h1>JavaScript is needed</h1><p>This revision tool runs in your browser and needs JavaScript switched on.</p></div></noscript>
</main>
<footer class="site-footer"><p id="footer-text"></p></footer>
<div id="live" class="sr" aria-live="polite" role="status"></div>

<script>
/* Unit 14 Revision Bot: shared setup and teacher settings.
   Edit this file to change the title, add assessment lock dates, or rename the site. */
window.U14 = window.U14 || { kb: [], quiz: [], practice: [], sorter: [], papers: [], technique: {} };

U14.config = {
  title: "Unit 14 Revision Bot",
  subtitle: "BTEC Level 3 IT: IT Service Delivery",
  college: "Exeter College",
  faculty: "Cyber & Digital Technologies",
  version: "1.0",
  updated: "November 2026",
  storageKey: "u14rb_v1",

  /* ASSESSMENT LOCK
     The real Part A and Part B must be done without guidance from teachers.
     Add the dates of your live window below and the whole tool is replaced by a
     notice while that window is open. Dates use the form YYYY-MM-DD.

      short: "A report on the implications of your solution: for implementing it, supporting staff, supporting customers and managing IT assets, taking account of constraints and changes.",
      more: [
        "It is the weakest activity every series. Most learners describe or list benefits instead of explaining consequences.",
        "Cover all four areas. Name actions, risks and consequences, and link to the scenario.",
        "Use the template and keep the structure clear."
      ],
      example: "\"Moving the data takes a weekend, so shops must trade on paper that Saturday. Staff need a short training session beforehand.\"",
      spec: "A1, D3", related: ["implications", "implication-vs-benefit", "implementation-impact"]
    },
    {
      id: "implication-vs-benefit", topic: "exam", term: "Implication or benefit or description?",
      aka: ["implication vs benefit", "implications vs benefits", "what is an implication", "difference between implication and benefit", "benefits or implications"],
      short: "A description says what something is. A benefit says what good it does. An implication says what will happen or must happen because of it, which may be good, bad or neutral.",
      more: [
        "Describe: \"The new system stores data in the cloud.\"",
        "Benefit: \"This means staff can see stock from any shop.\"",
        "Implication: \"Because data moves to the cloud, we need a backup connection and staff need a login for each person, so Dan must set up accounts before launch.\"",
        "Test: if you can add \"so what, and what do we need to do about it?\" you are on the right track."
      ],
      example: "Use the sorter game in Practice to test yourself.",
      spec: "Assessment", related: ["implications", "activity-5"]
    },
    {
      id: "evaluate-vs-describe", topic: "exam", term: "Evaluate versus describe",
      aka: ["evaluate or describe", "command words", "describe vs evaluate", "evaluate command word", "explain vs describe"],
      short: "Describe says what it is. Explain says how or why. Discuss looks at more than one side. Evaluate weighs strengths and weaknesses and reaches a justified judgement.",
      more: [
        "Describe: facts and detail.",
        "Explain: reasons and links, using because, so and therefore.",
        "Discuss: several views or factors.",
        "Evaluate: judge how well it works, compare, and give a conclusion with a reason."
      ],
      example: "\"It is cheaper\" is description. \"It is cheaper, but with one technician we risk long outages, so I would pay more for managed support\" is evaluation.",
      spec: "Assessment", related: ["evaluate-solution", "activity-4", "command-words"]
    },
    {
      id: "command-words", topic: "exam", term: "Command words",
      aka: ["identify", "state", "describe", "explain", "discuss", "evaluate", "assess", "compare", "justify", "analyse", "outline", "command word"],
      short: "The key verb tells you how deep to go. Identify and state are short. Describe gives detail. Explain gives reasons. Discuss, assess and compare look at several points. Evaluate and justify end with a judgement.",
      more: [
        "Identify or state: name it, briefly.",
        "Outline: main points, not full detail.",
        "Describe: what it is like.",
        "Explain: why or how, with a reason.",
        "Compare: similarities and differences.",
        "Assess or discuss: weigh factors and say how important they are.",
        "Evaluate or justify: judge and defend your choice."
      ],
      example: "\"Explain two factors\" needs two named factors each with a reason and a consequence.",
      spec: "Assessment", related: ["evaluate-vs-describe", "technical-language"]
    },
    {
      id: "technical-language", topic: "exam", term: "Using technical language (4 marks)",
      aka: ["technical language", "technical terms", "key words", "vocabulary", "use of technical language"],
      short: "Marks are given for using correct IT terms accurately and in context across the task. Use the proper word and show you know what it means.",
      more: [
        "Say \"switch\", \"router\", \"firewall\", \"SaaS\", \"scalability\", \"backup\", \"access level\", not \"the box\" or \"the internet thing\".",
        "Use terms in a sentence that proves understanding, not as a list of words.",
        "Spread them across all activities."
      ],
      example: "\"A firewall on each shop router limits what can reach the till network.\"",
      spec: "Assessment", related: ["command-words", "templates-naming"]
    },
    {
      id: "templates-naming", topic: "exam", term: "Templates, file names and submission",
      aka: ["file names", "naming", "templates", "pdf", "submission", "how do i name my files", "save as pdf"],
      short: "Use the supplied templates for the activities that provide them, name each file exactly as the task says, save often and submit each activity as a PDF if instructed.",
      more: [
        "Example from the Quay Cycles practice task: activity1strategy_[Surname]_[first letter of first name].",
        "Always check the exact instructions in your task booklet because they can change between series."
      ],
      example: "activity3solution_Smith_J.",
      spec: "Assessment", related: ["part-b", "time-plan"]
    },
    {
      id: "common-mistakes", topic: "exam", term: "Common mistakes that lose marks",
      aka: ["mistakes", "why do people lose marks", "lose marks", "examiner reports", "how to improve", "what do examiners say", "common errors", "weak answers"],
      short: "Examiner reports repeat the same messages: generic answers not tied to the scenario, benefits instead of implications, hardware only with no data and information, and evaluations that describe or only list future ideas.",
      more: [
        "Not using scenario facts: names, numbers, budget, staff and locations.",
        "Activity 5: listing benefits or repeating the design instead of explaining consequences.",
        "Activity 3: covering hardware but missing information and data requirements, or giving no justification.",
        "Activity 4: describing rather than evaluating, and not covering future needs.",
        "Running out of time on the later activities.",
        "Copying definitions from notes without applying them."
      ],
      example: "After every point ask: which fact from the scenario does this link to?",
      spec: "Assessment", related: ["past-paper-patterns", "implication-vs-benefit", "evaluate-vs-describe"]
    },
    {
      id: "past-paper-patterns", topic: "exam", term: "Patterns across past papers",
      aka: ["past papers", "past paper", "patterns", "previous papers", "past series", "what comes up", "repeat questions"],
      short: "Each series gives a new organisation but the same five activity shapes. The scenario changes, the skills do not.",
      more: [
        "Every scenario has a current set up with problems, a plan for change, a budget or limit, and customers with needs.",
        "Constraints such as small staff, ageing equipment, security worries and growth come up again and again.",
        "Practise with different sectors so you can apply the same method to a school, a clinic, a charity, a shop or a food firm.",
        "Use the Past Papers section to see how each scenario was approached."
      ],
      example: "Spot the \"trap\" in each scenario, for example a single server, an under skilled technician, or a deadline.",
      spec: "Assessment", related: ["common-mistakes", "task-structure"]
    },
    {
      id: "grading", topic: "exam", term: "Marks, bands and grades",
      aka: ["grade boundaries", "grade", "pass merit distinction", "bands", "band descriptors", "how are marks given", "mark scheme", "marking grid", "how is it marked"],
      short: "Each activity is marked against bands. Higher bands need clear reasoning, consistent links to the scenario and a balanced judgement, not just more content.",
      more: [
        "Marks come from how well you meet each band, not from counting points.",
        "Grade boundaries differ between series and are published by the awarding body after marking. Check the current information from your tutor.",
        "A longer answer does not score higher on its own. Relevant, reasoned and linked answers do."
      ],
      example: "\"Because\" and \"so\" sentences are what lift an answer into the upper bands.",
      spec: "Assessment", related: ["evaluate-vs-describe", "common-mistakes"]
    }
  );

  /* ---------- Law overview (links to the detailed law entries) ---------- */
  kb.push({
    id: "laws-overview", topic: "context", term: "Laws to know for Unit 14",
    aka: ["legislation", "laws", "acts", "which laws", "relevant legislation", "law list", "laws and regulations", "what laws should i know", "legal requirements"],
    short: "Eight sets of rules come up most: data protection, computer misuse, copyright, communications, interception and monitoring, health and safety, display screen equipment and electrical waste.",
    more: [
      "Data protection: UK GDPR with the Data Protection Act 2018. How personal data is used and kept safe.",
      "Computer Misuse Act 1990: unauthorised access to or damage of computers and data.",
      "Copyright, Designs and Patents Act 1988: licences for software and other creative work.",
      "Communications Act 2003: misuse of public communications networks and Ofcom.",
      "RIPA 2000 and the Lawful Business Practice Regulations 2000: when communications may be monitored.",
      "Health and Safety at Work Act 1974: safe workplaces, including cables and equipment.",
      "Health and Safety (Display Screen Equipment) Regulations 1992, amended 2002: safe screen use.",
      "WEEE Regulations 2013: recycling old electronic equipment.",
      "Pick the ones that really matter for the scenario and say what the organisation must do about each one."
    ],
    example: "A shop holding customer records: data protection first, then copyright for software licences and WEEE for the old PCs.",
    spec: "A3, B2", related: ["data-protection", "computer-misuse-act", "copyright-act", "communications-act", "ripa-lbp", "hswa", "dse-regs", "weee"]
  });
})();

</script>
<script>
/* Multiple choice questions. Q(topic, question, correct answer, [three wrong answers], explanation, kb id to revise)
   The correct answer is listed first here. The app shuffles the options every time. */
(function () {
  var n = 0;
  function Q(topic, q, right, wrong, why, kb) {
    n += 1;
    U14.quiz.push({ id: "q" + n, topic: topic, q: q, right: right, wrong: wrong, why: why, kb: kb || "" });
  }

  /* ---- Lifecycle and ITIL ---- */
  Q("lifecycle", "What are the three stages of the IT service lifecycle used in this unit?",
    "Service identification, service delivery design, service management",
    ["Plan, build, retire", "Requirements, coding, testing", "Purchase, install, dispose"],
    "The lifecycle starts by finding needs, then designs the solution, then keeps managing and reviewing it. It loops back to the start.", "service-lifecycle");
  Q("lifecycle", "Which of these is NOT one of the six ITIL value chain activities?",
    "Retire",
    ["Plan", "Engage", "Deliver and support"],
    "The six activities are Plan, Improve, Engage, Design and transition, Obtain or build, and Deliver and support.", "value-chain");
  Q("lifecycle", "Which list shows the four dimensions of ITIL 4?",
    "Organisations and people, information and technology, partners and suppliers, value streams and processes",
    ["Hardware, software, networks, people", "Plan, do, check, act", "Cost, time, quality, risk"],
    "ITIL 4 says every service should be looked at from these four sides.", "four-dimensions");
  Q("lifecycle", "A till will not start. Getting it working again as fast as possible is part of which process?",
    "Incident management",
    ["Problem management", "Change management", "Asset management"],
    "Incident management is about restoring normal service quickly.", "incident-management");
  Q("lifecycle", "The same router fault has happened five times this month. Finding the root cause is which process?",
    "Problem management",
    ["Incident management", "Service desk", "Release management"],
    "A problem is the underlying cause of one or more incidents. Problem management investigates so it stops coming back.", "problem-management");
  Q("lifecycle", "Why is change management used?",
    "So changes are planned, approved, tested and checked, and do not cause new faults",
    ["So no changes are ever made", "So staff can install anything they like", "To make the project finish sooner"],
    "It controls change. It does not stop change.", "change-management");
  Q("lifecycle", "What does an SLA set out?",
    "The level of service a provider promises, such as uptime and fix times",
    ["The price of the hardware only", "A list of staff passwords", "The layout of the network"],
    "A service level agreement is a written promise about service levels, often with consequences if missed.", "sla");
  Q("lifecycle", "Which statement best describes ITIL?",
    "A set of good practice guidance for running IT services",
    ["A law that all organisations must follow", "A type of software", "A programming language"],
    "ITIL is advice. Organisations choose what suits them.", "itil");
  Q("lifecycle", "What does the first stage of the lifecycle, service identification, produce?",
    "An outline IT service strategy and an outline IT service catalogue",
    ["A finished network", "A set of user accounts", "A backup plan"],
    "It works out the needs, puts them in priority order and lists the services needed.", "service-identification");

  /* ---- Methodologies ---- */
  Q("methods", "Which methodology completes each stage before the next one starts?",
    "Waterfall", ["Agile", "RAD", "Lean"],
    "Waterfall runs in order: requirements, design, build, test, release.", "waterfall");
  Q("methods", "A client is unsure what they want and expects needs to change. Which method fits best?",
    "Agile", ["Waterfall", "PRINCE2 with no changes allowed", "None, you should not start"],
    "Agile works in short cycles with regular feedback, so changing needs can be handled.", "agile");
  Q("methods", "Which methodology uses a business case that is checked throughout the project?",
    "PRINCE2", ["RAD", "Lean", "Scrum"],
    "PRINCE2 is formal, with set stages, clear roles and regular checks that the project is still worth doing.", "prince2");
  Q("methods", "Which method builds quick prototypes that users try and then improve?",
    "RAD (Rapid Application Development)", ["Waterfall", "PRINCE2", "Lean"],
    "RAD gets a working version in front of users early and improves it.", "rad");
  Q("methods", "Which method focuses on cutting waste and delivering only what gives value to the customer?",
    "Lean", ["Waterfall", "RAD", "PRINCE2"],
    "Lean comes from manufacturing and aims for less waste and constant improvement.", "lean");
  Q("methods", "What is a main drawback of Waterfall?",
    "Problems are often found late and it is hard to go back",
    ["It has no plan", "It cannot be used for software", "Users see the product every week"],
    "Testing is near the end, so mistakes in early stages can be expensive to fix.", "waterfall");
  Q("methods", "What is a typical drawback of PRINCE2 on a small project?",
    "It can involve a lot of paperwork and feel heavy",
    ["It has no roles", "It ignores the budget", "It cannot be planned"],
    "PRINCE2 suits large projects. On a small one the control can be more than is needed.", "prince2");

  /* ---- Strategy, catalogue, requirements ---- */
  Q("strategy", "What is an IT service strategy?",
    "A document listing the IT services needed in priority order, with reasons",
    ["A list of every device owned", "A user manual", "A set of passwords"],
    "In Activity 1 you list requirements, set priorities and explain each with a fact from the brief.", "it-service-strategy");
  Q("strategy", "What does an IT service catalogue contain?",
    "Each IT service with a description of what it must achieve",
    ["The staff timetable", "The prices charged to customers", "Only hardware serial numbers"],
    "The catalogue lists services and describes the requirements for each.", "it-service-catalogue");
  Q("strategy", "Which of these is the better way to write a service requirement?",
    "One stock list that every shop and the website can see",
    ["Buy stock software", "Get a server", "Use the cloud"],
    "A requirement states the need. Jumping straight to a product comes later.", "service-requirement");
  Q("strategy", "Why should priorities be justified using facts from the brief?",
    "It shows judgement and links the answer to this organisation",
    ["Because every requirement should be high priority", "Because facts make the answer longer", "It is not needed"],
    "Marking everything high shows no judgement. Reasons from the scenario show you understand the organisation.", "prioritising");
  Q("strategy", "Which is an example of a customer need rather than an organisational need?",
    "Seeing real stock levels online before travelling to a shop",
    ["Reducing stock losses", "Cutting the IT budget", "Reducing staff overtime"],
    "Customer needs are about what the buyer wants. Organisational needs are about how the business runs.", "organisational-vs-customer-needs");

  /* ---- Roles and benefits ---- */
  Q("roles", "Who designs the overall structure of an IT system?",
    "Architect", ["Technician", "Service desk", "Developer"],
    "The architect decides how the parts fit together. The developer then builds it.", "architect");
  Q("roles", "Who is the first point of contact when someone has an IT problem?",
    "Service desk staff", ["Project manager", "Architect", "Developer"],
    "They log the issue, fix simple things and pass on harder ones.", "service-desk-staff");
  Q("roles", "Who controls the budget, timetable and risks of an IT project?",
    "Project manager", ["Technician", "Service desk", "Architect"],
    "Project managers plan, control and report on a project.", "project-manager");
  Q("roles", "Who installs and maintains hardware and networks on site?",
    "Technician", ["Project manager", "Architect", "Developer"],
    "Technicians look after the day to day running of the solution.", "technician");
  Q("roles", "Which is a benefit of managing IT services in a structured way?",
    "Services stay available and continue when needed",
    ["Staff no longer need training", "Customers are not needed", "Hardware never fails"],
    "Continuity and availability is one of the listed benefits, alongside standards and automation.", "lifecycle-benefits");

  /* ---- Organisations ---- */
  Q("orgs", "A bakery that bakes and sells bread is mainly which type of organisation?",
    "Product based", ["Service based", "Voluntary sector", "Primary industry"],
    "It makes and sells something people can hold.", "product-vs-service-org");
  Q("orgs", "A charity run by trustees is part of which sector?",
    "Voluntary", ["Public", "Private", "Primary"],
    "Voluntary sector organisations are non profit.", "org-sectors");
  Q("orgs", "Which is a secondary industry?",
    "Manufacturing", ["Farming", "Banking", "Mining"],
    "Primary collects raw materials, secondary makes products, tertiary provides services.", "primary-secondary-tertiary");
  Q("orgs", "Which organisational function would use stock control and supplier ordering?",
    "Supply chain management", ["Staff recruitment", "Marketing and sales", "Customer relations"],
    "Supply chain systems track stock, orders and deliveries.", "org-functions");
  Q("orgs", "In the context of this unit, who are customers?",
    "People or groups outside the organisation who use its product or service",
    ["Only people who pay in cash", "The staff", "The IT team"],
    "Clients and consumers count as customers. Staff are users.", "customers-definition");
  Q("orgs", "A construction firm works on remote sites. Which IT need is most likely?",
    "Mobile devices and secure file transfer", ["Large desktop servers on every site", "No network at all", "Printed forms only"],
    "People work away from an office, so mobile access and safe transfer matter.", "sector-it-needs");

  /* ---- Diagrams and defining needs ---- */
  Q("diagrams", "What does a data flow diagram show?",
    "How data moves through a process, where it is stored and where it goes",
    ["The physical layout of a room", "Who reports to whom", "The cost of each device"],
    "Entities, processes, data stores and labelled arrows show how data moves.", "data-flow-diagram");
  Q("diagrams", "Which diagram shows who reports to whom?",
    "Functional chart", ["Network diagram", "Floor plan", "Data flow diagram"],
    "A functional chart shows structure: teams, managers and roles.", "functional-chart");
  Q("diagrams", "Why does a floor plan matter when planning a network?",
    "It shows distances and where to place sockets, cables and access points",
    ["It shows software licences", "It lists customers", "It sets the budget"],
    "Copper network cable has a maximum run of about 100 metres, so distance matters.", "floor-plan");
  Q("diagrams", "Which five things help you find an organisation's requirements?",
    "Purpose and type, aims and goals, customer experience, staff, locations",
    ["Colour, size, speed, price, weight", "Hardware, software, cables, power, printers", "Sales, tax, rent, wages, stock"],
    "These are the sources of requirements listed in the specification.", "requirements-sources");
  Q("diagrams", "A network diagram should show which of these?",
    "Devices and how they connect, with the connection types labelled",
    ["Staff wages", "A list of laws", "Employee timetables"],
    "Use standard symbols and label links, such as cable type or Wi-Fi.", "network-diagram");

  /* ---- Context, ethics and law ---- */
  Q("context", "Scalability means:",
    "Coping with more or less demand without being rebuilt",
    ["Being cheap to buy", "Being easy to use", "Being secure"],
    "Scalable systems can grow or shrink with demand.", "scalability");
  Q("context", "Which law makes it a crime to access a computer system without permission?",
    "Computer Misuse Act 1990", ["Copyright Act", "Health and Safety at Work Act", "WEEE Regulations"],
    "It covers unauthorised access, access with intent and acts that impair a computer.", "computer-misuse-act");
  Q("context", "Which law covers copying software without a licence?",
    "Copyright, Designs and Patents Act 1988", ["Communications Act 2003", "DSE Regulations", "UK GDPR"],
    "Software is protected by copyright, so you need the right licences.", "copyright-act");
  Q("context", "How long does an organisation normally have to respond to a subject access request?",
    "One month", ["24 hours", "72 hours", "One year"],
    "People can ask to see their personal data. The normal deadline is one month.", "data-protection");
  Q("context", "How soon must a serious personal data breach be reported to the ICO?",
    "Within 72 hours", ["Within 24 hours", "Within one month", "Within one year"],
    "Serious breaches must be reported within 72 hours of becoming aware.", "data-protection");
  Q("context", "What is the maximum fine under UK GDPR for the most serious breaches?",
    "£17.5 million or 4% of worldwide turnover, whichever is higher",
    ["£1,000", "£100,000", "£1 million only"],
    "The higher tier is £17.5 million or 4% of annual worldwide turnover.", "data-protection");
  Q("context", "Which regulations relate to workstation set up for people who use screens a lot?",
    "Health and Safety (Display Screen Equipment) Regulations", ["WEEE Regulations", "Communications Act", "Computer Misuse Act"],
    "They require workstation assessments, breaks and eye tests on request.", "dse-regs");
  Q("context", "Which regulations deal with recycling old electronic equipment?",
    "WEEE", ["DSE", "RIPA", "UK GDPR"],
    "Waste Electrical and Electronic Equipment rules say it must be collected and recycled properly.", "weee");
  Q("context", "What does an acceptable use policy (AUP) do?",
    "Sets out what people may and may not do with the organisation's IT",
    ["Lists all hardware", "Sets the price of services", "Describes the backup times"],
    "It protects the organisation and makes expectations clear.", "aup");
  Q("context", "Reading all staff emails without telling them is most likely to cause which problem?",
    "Legal and ethical problems around monitoring and privacy",
    ["Faster networks", "Lower licence costs", "Better backups"],
    "Monitoring must be open, for a clear purpose, and within the law.", "monitoring-privacy");
  Q("context", "Which statement about ethics and the law is correct?",
    "Something can be legal but still unethical",
    ["If it is legal it is always ethical", "Ethics and law are the same", "Ethics only matter to large firms"],
    "Ethical issues are about what is right, which the law does not always cover.", "ethics-overview");
  Q("context", "Which law replaced the Interception of Communications Act 1985 for interception rules?",
    "RIPA 2000", ["DSE Regulations", "Copyright Act", "WEEE"],
    "RIPA 2000 and the Lawful Business Practice Regulations govern monitoring of business communications.", "ripa-lbp");

  /* ---- Designing and evaluating ---- */
  Q("design", "Which four strands must an IT service delivery solution cover?",
    "Information requirements, data requirements, hardware and software options, managing infrastructure and users",
    ["Cost, time, quality, scope", "Plan, build, test, release", "Strategy, catalogue, report, template"],
    "Examiners often see hardware covered well and data and information missed.", "solution-coverage");
  Q("design", "Which is an INFORMATION requirement rather than a data requirement?",
    "Managers need a weekly stock report for all shops",
    ["Customer records are backed up nightly", "Data is stored in the UK", "A database holds 50,000 records"],
    "Information is what people need to know. Data requirements describe the raw data behind it.", "information-vs-data-design");
  Q("design", "Which of these is one of the B4 factors when selecting information and data?",
    "Compatibility", ["Weather", "Tax", "Rent"],
    "Others include corporate message, processing cost, productivity, privacy, reliability, security, size, quality, user experience, accessibility, user needs and working practices.", "information-considerations");
  Q("design", "A new system cannot read the file format the old one uses. Which factor was ignored?",
    "Compatibility", ["Corporate message", "Privacy", "Accessibility"],
    "Compatibility is about working with what already exists.", "compatibility");
  Q("design", "A website that works with screen readers and keyboard control supports which factor?",
    "Accessibility", ["Processing cost", "Scalability", "Corporate message"],
    "Accessibility means people with different needs can use the service.", "accessibility-factor");
  Q("design", "Which is a good evaluation sentence?",
    "It is cheaper, but with one part time technician an outage could last days, so managed support is worth the extra cost.",
    ["It is cheaper.", "The system has many features.", "The system is good because it is good."],
    "Evaluation weighs strengths and weaknesses and reaches a reasoned judgement.", "evaluate-solution");
  Q("design", "In Activity 5, which sentence is an implication?",
    "Because data moves to the cloud, shops need a backup connection and accounts must be set up before launch.",
    ["The system stores data in the cloud.", "The cloud is a good choice.", "Cloud storage is popular."],
    "An implication says what will happen or must be done because of the design.", "implication-vs-benefit");
  Q("design", "Which putting-in approach rolls a system out one site at a time?",
    "Phased rollout", ["Big bang", "Parallel running only", "Retirement"],
    "Phased rollouts lower risk. A big bang changes everything at once.", "implementation-impact");
  Q("design", "Running the old and new systems together for a while is called:",
    "Parallel running", ["Big bang", "Pilot only", "Decommissioning"],
    "It gives a safety net if the new system has problems.", "implementation-impact");
  Q("design", "The B2 list of factors that can help or limit a solution includes:",
    "Costs, legal, location, risks, scalability, security and sustainability",
    ["Weather, music, fashion", "Only costs", "Only technology"],
    "Eleven factors: technology, costs, environmental, ethical, legal, location, moral, risks, scalability, security, sustainability.", "b2-factors");

  /* ---- Information and data ---- */
  Q("data", "Which is INFORMATION rather than data?",
    "37 bikes in stock at Exeter, 12 fewer than last week",
    ["37", "A barcode number", "A list of raw till scans"],
    "Information is data processed and put in context.", "data-vs-information");
  Q("data", "Decisions about opening a new shop next year are what level of information?",
    "Strategic", ["Operational", "Management", "Technical"],
    "Strategic decisions are long term and affect the whole organisation.", "info-levels");
  Q("data", "Today's repair job list for mechanics is mostly which level of information?",
    "Operational", ["Strategic", "Management", "Political"],
    "Operational information supports day to day work.", "info-levels");
  Q("data", "What do the three Vs stand for?",
    "Volume, velocity, variety", ["Value, version, vendor", "Virtual, visual, voice", "Verify, validate, view"],
    "How much data, how fast it arrives, and how many types.", "three-vs");
  Q("data", "Orders arriving very quickly on sale day is an example of which V?",
    "Velocity", ["Volume", "Variety", "Verification"],
    "Velocity is the speed data arrives or must be processed.", "three-vs");
  Q("data", "Which pair of data types shows high variety?",
    "Text, photos, video and payment records", ["Only numbers", "Only text", "Only dates"],
    "Variety is about the different forms data takes.", "three-vs");
  Q("data", "In the CIA triad, integrity means:",
    "Data is accurate and not changed wrongly", ["Only the right people can see it", "It is available at all times", "It is encrypted"],
    "Confidentiality is who can see it. Availability is when it can be used.", "cia-triad");
  Q("data", "A login that limits who can see customer data mainly supports:",
    "Confidentiality", ["Availability", "Scalability", "Integrity only"],
    "Controls on who can see data protect confidentiality.", "cia-triad");

  /* ---- Software ---- */
  Q("software", "Which is an operating system?",
    "Windows", ["Excel", "Antivirus", "A web browser"],
    "The operating system runs the device and lets other programs use the hardware.", "operating-system");
  Q("software", "Antivirus and backup tools are examples of:",
    "Utility software", ["Application software", "Operating systems", "Expert systems"],
    "Utility software maintains and protects a computer.", "utility-software");

<script>

<script>

  function buildRun(topic, count, prioritise, onlyIds) {

    if (!A.storageOk) main.appendChild(h("div", { class: "card bad" }, h("p", { text: "This browser is blocking saving, so your progress will be lost when you close the page." })));
    var runs = A.data.quiz.runs, seen = Object.keys(A.data.quiz.q), right = 0, total = 0;
    seen.forEach(function (k) { right += A.data.quiz.q[k].right; total += A.data.quiz.q[k].right + A.data.quiz.q[k].wrong; });
    var known = 0, learning = 0; Object.keys(A.data.cards).forEach(function (k) { if (A.data.cards[k] === 2) known++; else learning++; });
    var attempted = Object.keys(A.data.practice).filter(function (k) { return A.data.practice[k].attempts; }).length;
    main.appendChild(h("div", { class: "stats" },
      stat(String(runs.length), "quizzes completed"), stat(total ? A.pct(right, total) + "%" : "None yet", "answers right overall"),
      stat(seen.length + " of " + U14.quiz.length, "questions seen"), stat(known + " of " + U14.kb.length, "flashcards known"),
      stat(attempted + " of " + U14.practice.length, "practice tasks tried"), stat(String(A.data.sorter.best), "best sorter score")));
    var st = A.topicStats(), weakList = [];
    var c = h("section", { class: "card" }, h("h2", { text: "Quiz accuracy by topic" }));
    U14.topics.forEach(function (t) {
      var s = st[t.id];
      if (s.total) { c.appendChild(A.barRow(t.name, A.pct(s.right, s.total), t.colour, s.right + " of " + s.total)); if (s.right / s.total < 0.7) weakList.push(t); }
      else c.appendChild(h("p", { class: "small" }, t.name + ": not tried yet. ", h("a", { href: "#/quiz?topic=" + t.id, text: "Try it" })));
    });
    main.appendChild(c);
    if (weakList.length) main.appendChild(h("section", { class: "card suggest" }, h("h2", { text: "Revise these next" }),
      h("ul", {}, weakList.map(function (t) { return h("li", {}, h("a", { href: "#/learn/" + t.id, text: t.name }), " ", h("a", { href: "#/quiz?topic=" + t.id + "&go=1", text: "(quiz)" })); }))));
    if (runs.length) {
      main.appendChild(h("section", { class: "card" }, h("h2", { text: "Recent quizzes" }),
        h("ul", {}, runs.slice(-8).reverse().map(function (r) { return h("li", { text: r.d + ": " + (r.t === "all" ? "All topics" : U14.topicName(r.t)) + ", " + r.s + " out of " + r.n }); }))));
    }
    var imp = h("input", { type: "file", accept: "application/json,.json", class: "sr", id: "imp", onchange: function () {
      var f = imp.files && imp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { try { var d = JSON.parse(rd.result); if (d && d.v === 1) { var pr = A.data.prefs; A.data = d; if (!A.data.prefs) A.data.prefs = pr; A.save(); A.render(); } else window.alert("That file does not look like saved progress."); } catch (e) { window.alert("That file could not be read."); } };
      rd.readAsText(f);
    } });
    main.appendChild(h("section", { class: "card" }, h("h2", { text: "Save or move your progress" }),
      h("p", { class: "small", text: "Download a file to keep a copy or to move to another device, then load it there." }),
      h("div", { class: "row-actions" },
        h("button", { class: "btn", type: "button", text: "Download my progress", onclick: function () {
          try {
            var blob = new Blob([JSON.stringify(A.data)], { type: "application/json" }), a = document.createElement("a");
            a.href = URL.createObjectURL(blob); a.download = "unit14-progress.json"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
          } catch (e) { window.alert("Downloading is not available in this browser."); }
        } }), " ",
        h("label", { class: "btn", for: "imp", text: "Load saved progress" }), imp, " ",
        h("button", { class: "btn danger", type: "button", text: "Reset everything", onclick: function () { if (window.confirm("This deletes all your saved progress on this device. Continue?")) { A.resetProgress(); A.render(); } } }))));
  };
})();

</script>
<script>
/* Start up: lock check, header controls, navigation and routing. */
(function () {
  var A = U14.app, h = A.h, cfg = U14.config;
  var root = document.documentElement;

  function applyPrefs() {
    var p = A.data.prefs || {};
    root.setAttribute("data-theme", p.theme || "light");
    root.style.fontSize = (p.size || 100) + "%";
  }
  applyPrefs();

  function teacherMode() { return /[?&#]teacher=1/.test(location.href); }

  function lockWindow() {
    var now = new Date(), today = now.getFullYear() + "-" + ("0" + (now.getMonth() + 1)).slice(-2) + "-" + ("0" + now.getDate()).slice(-2);
    var list = cfg.lockWindows || [];
    for (var i = 0; i < list.length; i++) { if (today >= list[i].from && today <= list[i].to) return list[i]; }
    return null;
  }

  function buildHeader() {
    var t = document.getElementById("site-title"), s = document.getElementById("site-sub");
    if (t) t.textContent = cfg.title;
    if (s) s.textContent = cfg.college + ", " + cfg.faculty;
    document.title = cfg.title + " | " + cfg.college;
    var ctl = document.getElementById("controls");
    if (!ctl) return;
    var sel = h("select", { id: "theme", class: "select small-select", "aria-label": "Colour theme", onchange: function () { A.data.prefs.theme = sel.value; A.save(); applyPrefs(); } },
      [["light", "Light"], ["cream", "Cream"], ["dark", "Dark"]].map(function (o) { return h("option", { value: o[0], text: o[1], selected: (A.data.prefs.theme || "light") === o[0] }); }));
    function size(delta) { var v = Math.max(85, Math.min(150, (A.data.prefs.size || 100) + delta)); A.data.prefs.size = v; A.save(); applyPrefs(); }
    ctl.appendChild(h("label", { class: "sr", for: "theme", text: "Colour theme" }));
    ctl.appendChild(sel);
    ctl.appendChild(h("button", { class: "iconbtn", type: "button", "aria-label": "Make text smaller", text: "A−", onclick: function () { size(-10); } }));
    ctl.appendChild(h("button", { class: "iconbtn", type: "button", "aria-label": "Make text larger", text: "A+", onclick: function () { size(10); } }));
    ctl.appendChild(h("button", { class: "iconbtn", type: "button", "aria-label": "Print this page", text: "Print", onclick: function () { window.print(); } }));
  }

  function buildFooter() {
    var f = document.getElementById("footer-text");
    if (f) f.textContent = cfg.title + " version " + cfg.version + ", updated " + cfg.updated + ". Independent revision support, not published or endorsed by Pearson. Works offline. Progress stays on your device.";
  }

  function start() {
    buildHeader(); buildFooter();
    var lock = lockWindow();
    if (lock && !teacherMode()) {
      document.getElementById("nav").style.display = "none";
      var main = document.getElementById("main");
      main.appendChild(h("div", { class: "card lock" }, h("h1", { text: "Revision tool paused" }),
        h("p", { text: cfg.lockMessage }),
        lock.label ? h("p", { class: "small", text: "Assessment window: " + lock.label }) : null));
      return;
    }
    if (lock && teacherMode()) {
      var bar = h("div", { class: "teacherbar", role: "note", text: "Teacher preview: the assessment lock is on for students (" + (lock.label || lock.from + " to " + lock.to) + ")." });
      document.body.insertBefore(bar, document.body.firstChild);
    }
    document.addEventListener("keydown", function (ev) {
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      if (typeof A.keyHandler === "function") A.keyHandler(ev);
    });
    window.addEventListener("hashchange", A.render);
    if (!location.hash || location.hash === "#") { try { history.replaceState(null, "", "#/home"); } catch (e) { location.hash = "#/home"; } }
    A.render();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

</script>
